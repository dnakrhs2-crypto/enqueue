<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ws://127.0.0.1:*; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>LiveMix</title>
  <link rel="stylesheet" href="inspector.css">
  <script src="strings.js" defer></script>
  <script src="inspector.js" defer></script>
</head>
<body>
  <p id="status" role="status" aria-live="polite"></p>
  <label id="channel-row"><span id="channel-label">Microphone</span><select id="channel" disabled></select></label>
  <label id="fx-row" hidden><span id="fx-label">FX channel</span><select id="fx" disabled></select></label>
  <label id="group-row" hidden><span id="group-label">Group</span><select id="group" disabled></select></label>
  <label id="mode-row"><span id="mode-label">Mode</span><select id="mode"></select></label>
  <label id="step-row" hidden><span id="step-label">Step</span><select id="step"></select></label>
  <label id="target-row" hidden><span id="target-label">Target (%)</span><input id="target" type="number" min="0" max="100" step="1" value="50"></label>
  <label id="press-row" hidden><span id="press-label">Press</span><select id="press"></select></label>
  <label id="display-row" hidden><span id="display-label">Display</span><select id="display"></select></label>
  <p id="note" hidden></p>
  <label id="fallback-row" class="checkbox"><input id="fallback" type="checkbox" checked><span id="fallback-label">Match the same name when changing sessions</span></label>
  <label id="title-row"><span id="title-label">Display name</span><input id="short-title" type="text" maxlength="64"></label>
</body>
</html>
