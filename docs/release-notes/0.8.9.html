<h2>GoCue 0.8.9</h2>
<ul>
  <li><b>다채널 출력은 ASIO에서만</b>: Windows Audio(공유/독점/저지연)와 DirectSound에서는 출력 1-2만 열립니다. 저장돼 있던 다채널 설정도 그 모드에서는 처음부터 1-2로 열리고, 장치가 넓은 요청을 거부하면 1-2로 다시 시도합니다. 오디오 출력 설정의 채널 목록은 ASIO에서만 보이고, 다른 모드에는 안내 문구가 붙습니다.</li>
  <li>장치가 채널 구성만 바꿔 다시 열릴 때(모드 전환 등) 재생 중인 큐가 끊기거나 몇십 ms를 건너뛰지 않습니다. 다시 열기에 실패하면 안내 창이 뜹니다.</li>
</ul>
