<h2>Enqueue 0.16.4</h2>
<p>유튜브다운이 일부 영상을 받지 못하던 문제를 고쳤습니다.</p>
<ul>
  <li><b>다운로드 도구(yt-dlp)를 새 판으로 바꿨습니다.</b> 'HTTP Error 403: Forbidden'으로 받지 못하던 영상과, 어린이용 영상처럼 '받을 수 있는 오디오(AAC) 형식이 없는 영상'으로 잘못 안내되던 영상을 받을 수 있습니다.</li>
  <li>유튜브가 바뀌어 받기에 실패하면 다운로드 도구를 스스로 최신으로 갱신한 뒤 한 번 더 받습니다. '볼 수 없는 영상'이나 '형식이 없는 영상'으로 나올 때도 먼저 갱신을 시도합니다.</li>
</ul>
