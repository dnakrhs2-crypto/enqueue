<h2>Enqueue 0.10.6</h2>
<ul>
  <li><b>큐 메뉴에 큐 종류 아이콘.</b> 큐 메뉴의 추가 항목(큐 추가, 페이드 인, 페이드 아웃, 디밴프, 그룹, 제어, 대기, 메모, 마이크)과 새 큐 리스트·새 카트에 종류별 아이콘이 붙습니다. 큐 표의 우클릭 메뉴와 리스트 탭의 + 메뉴에도 같은 아이콘이 나옵니다. 아이콘은 벡터라 글씨·화면 크기 설정(100~150%)과 윈도우 배율에서 그대로 선명하고, 비활성·강조 상태에서는 글자와 같은 색으로 바뀝니다. 아이콘이 없는 항목도 글자 시작 위치가 같아 메뉴 글자가 한 열로 맞습니다.</li>
</ul>
