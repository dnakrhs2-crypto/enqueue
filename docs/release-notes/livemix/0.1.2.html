<h2>LiveMix 0.1.2</h2>
<ul>
  <li><b>창 크기를 못 바꾸던 문제.</b> "ASIO 장치를 열지 못했습니다" 같은 안내가 대화 상자로 떠 있는 동안에는 창 가장자리를 끌어도 크기가 바뀌지 않고 마이크 버튼도 눌리지 않았습니다. 이제 안내는 창 안 위쪽의 띠로 나옵니다(✕로 닫음). 창은 언제나 모서리·가장자리로 줄이고 늘릴 수 있고, 최대화도 됩니다.</li>
  <li>세션을 열 때의 경고("세션의 ASIO 장치가 이 PC에 없습니다" 등)와 안전 모드 안내도 같은 띠로 나옵니다.</li>
</ul>
