<h2>LiveMix 0.5.4</h2>
<ul>
  <li><b>창 숨기기·불러오기 전역 핫키.</b> 설정의 '전역 핫키'에서 '창 숨기기/불러오기' 키를 지정할 수 있습니다. 창이 보이면 트레이로 숨기고, 최소화되거나 트레이에 있으면 다시 앞으로 불러옵니다. 트레이 메뉴에서도 같은 동작을 쓸 수 있습니다.</li>
  <li><b>FX 보내는 양 100% 표시 잘림 수정.</b> 마이크 카드의 FX 보내는 양이 100%일 때 '10..'처럼 잘리던 표시를 고쳤습니다. FX의 돌아오는 양과 마이크별 보내는 양도 끝까지 보이도록 다듬었습니다.</li>
</ul>
