<h2>LiveMix 0.17.4</h2>
<ul>
  <li><b>웹(폰)으로 들어온 사람의 목소리가 끊기던 문제를 고쳤습니다.</b> 폰으로 참여한 사람이 말하면 PC에서 듣는 사람들에게 소리가 자주 끊겨 들렸습니다. 방장과 LiveMix 참가자 모두 0.17.4로 업데이트하면 됩니다. 웹으로 들어오는 사람은 업데이트할 것이 없습니다.</li>
  <li><b>폰에서 다른 앱으로 잠깐 나가 있어도 합방에서 빠지지 않습니다.</b> 웹 참여자의 화면이 꺼지거나 다른 앱으로 넘어가면 방장 앱이 3초 만에 그 사람을 내보내던 것을 고쳤습니다.</li>
</ul>
