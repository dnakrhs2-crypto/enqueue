<h2>LiveMix 0.17.2</h2>
<ul>
  <li><b>OBS의 합방 상대 소스 이름이 상대 닉네임으로 바뀝니다.</b> 'LiveMix 합방 상대 1'·'LiveMix 합방 상대 2' 소스 이름이 그 자리에 들어온 사람의 닉네임으로 바뀌어, OBS 오디오 믹서에서 누구 소리인지 바로 보입니다. 다른 사람이 그 자리에 들어오면 그 사람 닉네임으로, 자리가 3초 넘게 비면 원래 이름으로 돌아갑니다. 소스 이름을 직접 바꿔 둔 경우는 그대로 둡니다. OBS 플러그인도 같이 업데이트되며 OBS를 다시 켜면 적용됩니다.</li>
</ul>
