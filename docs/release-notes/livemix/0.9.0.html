<h2>LiveMix 0.9.0</h2>
<ul>
  <li><b>온라인 백업에서 백업을 지울 수 있습니다.</b> 목록에서 백업을 고르고 '삭제'를 누르면 서버에서 지워집니다. 되돌릴 수 없어서 한 번 물어봅니다.</li>
  <li><b>백업 이름 바꾸기.</b> 고른 백업의 '이름 바꾸기'로 서버에 있는 파일 이름을 바꿉니다. 확장자는 그대로 붙고, 같은 이름이 이미 있으면 덮어쓰지 않고 알려줍니다.</li>
  <li><b>지금 세션으로 덮어쓰기.</b> 백업을 새로 쌓지 않고 고른 백업 파일에 지금 세션을 덮어씁니다. 파일 이름은 그대로 두고 내용만 바뀝니다. 플러그인 프리셋 백업에는 쓸 수 없습니다.</li>
</ul>
