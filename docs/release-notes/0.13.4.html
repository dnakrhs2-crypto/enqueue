<h2>Enqueue 0.13.4</h2>
<ul>
  <li><b>전체 화면이 생겼습니다(F11 · 편집 &gt; 전체 화면).</b> 메인 창이 작업표시줄까지 덮고 모니터를 꽉 채웁니다. 다른 프로그램으로 전환했다 돌아와도 그대로이고, 한 번 더 누르면 원래 창으로 돌아갑니다. 다음 실행은 창으로 시작합니다.</li>
  <li>Esc는 전체 페이드 정지라서 전체 화면을 끄지 않습니다.</li>
  <li>F11을 큐 핫키로 쓰던 프로젝트는 그대로 F11이 그 큐를 실행합니다. 그런 프로젝트에서는 편집 메뉴로 전체 화면을 켜고 끄세요.</li>
</ul>
