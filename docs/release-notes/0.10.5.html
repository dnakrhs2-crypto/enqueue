<h2>Enqueue 0.10.5</h2>
<ul>
  <li><b>푸터에 출력 진단 표시.</b> 오디오 상태 줄에 피크(지난 1초 최고 샘플 레벨), 클립(0 dBFS를 넘은 블록 수), xrun(드라이버가 보고한 끊김·제때 끝나지 못한 콜백 수)이 붙습니다. 클립이나 xrun이 0이 아니면 빨갛게 표시됩니다. ASIO는 0 dBFS를 넘는 소리를 그 자리에서 자르고 Windows Audio는 윈도우의 리미터가 먼저 눌러 주기 때문에, 같은 쇼가 Windows Audio에서는 멀쩡하고 ASIO에서만 자글거릴 때 이 숫자로 원인을 가릅니다.</li>
</ul>
