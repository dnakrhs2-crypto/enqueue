<h2>Enqueue 0.17.8</h2>
<ul>
  <li><b>재생 탭에서 페이드 인 시간을 숫자로 넣을 수 있습니다.</b> 리셋 옆 '페이드 인' 칸에 초(예: 3, 2.5)를 넣고 Enter를 누르면 엔벨로프의 페이드 인이 그 시간이 됩니다. 그룹 큐로 묶지 않아도 되고, 뒤쪽 엔벨로프 모양은 그대로 둡니다. 0을 넣으면 페이드 인을 없앱니다.</li>
  <li><b>재생 탭 칸에 쓴 값이 Enter 없이 다른 큐를 눌러도 들어갑니다.</b> 시작·끝·재생 횟수·속도·페이드 인 칸 모두 해당합니다. 이전에는 Enter를 누르지 않고 다른 큐를 누르면 입력이 사라졌습니다.</li>
</ul>
