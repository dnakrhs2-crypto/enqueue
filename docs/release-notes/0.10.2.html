<h2>Enqueue 0.10.2</h2>
<ul>
  <li><b>글씨·화면 크기.</b> 프로젝트 설정 &gt; 일반에 "글씨·화면 크기 (이 PC)"가 생겼습니다. 100 / 110 / 125 / 150%로 창 전체(글씨·버튼·행·간격)가 같은 비율로 커지고, 프로젝트가 아니라 이 PC에만 저장됩니다. 화면이 작아 최소 창이 들어가지 않는 배율은 그 아래로 내려 적용합니다.</li>
  <li><b>쇼 모드에서 파형 클릭 잠금.</b> 쇼 모드에서는 재생 탭의 파형을 눌러도 재생 위치가 옮겨지거나 재생이 시작되지 않고, 트림 손잡이·엔벨로프·슬라이스 마커도 건드려지지 않습니다.</li>
</ul>
