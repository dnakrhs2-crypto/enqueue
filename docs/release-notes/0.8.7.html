<h2>GoCue 0.8.7</h2>
<ul>
  <li><b>고품질 리샘플러</b>: 파일과 장치의 샘플레이트가 다를 때(예: 48k 파일 → 44.1k ASIO) 이제 r8brain(윈도우드 싱크, 선형 위상, 21 kHz까지 평탄, 앨리어싱 -140 dB 이하)으로 변환합니다. 전에는 선형 보간이었습니다. 같은 샘플레이트면 변환 없이 그대로 통과합니다.</li>
  <li><b>재생 탭 페이드 엔벨로프 실시간 반영</b>: 재생 중에 점을 움직이거나 사용/직선/잠금을 바꾸면 바로 들립니다(전에는 다음 재생부터).</li>
</ul>
