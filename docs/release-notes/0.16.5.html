<h2>Enqueue 0.16.5</h2>
<p>큐 리스트·카트 탭의 순서를 바꿀 수 있습니다.</p>
<ul>
  <li><b>탭을 좌우로 끌어서 옮깁니다.</b> 끄는 동안 놓일 자리에 보라색 세로선이 보입니다. 탭이 많아 옆으로 밀려 있으면 끝에 대고 있는 동안 저절로 넘어갑니다.</li>
  <li>탭을 오른쪽 클릭해 '왼쪽으로 이동' / '오른쪽으로 이동'으로 한 칸씩 옮길 수도 있습니다.</li>
  <li>바꾼 순서는 프로젝트와 함께 저장되고, 실행 취소(Ctrl+Z)로 되돌릴 수 있습니다. 쇼 모드에서는 옮겨지지 않습니다.</li>
</ul>
