<title>쿠팡으로 이동</title>
<script>
// Count the visit first: the Cloudflare beacon below sends its page view right after "load" (navigator.sendBeacon,
// which survives the navigation), so the page moves on a moment later. A blocked or failing beacon still lets "load"
// fire, and 3 s is the upper bound either way. This script stays above the stylesheet: a stylesheet still loading
// (style.css @imports a font CSS from another host) would otherwise hold it back, the 3 s timer included.
(function () {
  var target = "https://link.coupang.com/a/gJIOd2FuJU", gone = false;
  function go() { if (!gone) { gone = true; location.replace(target); } }
  addEventListener("load", function () { setTimeout(go, 300); });
  setTimeout(go, 3000);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://link.coupang.com/a/gJIOd2FuJU"></noscript>
<link rel="stylesheet" href="../style.css">
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "__CF_BEACON_TOKEN__"}'></script>
</head>
<body>
<main class="wrap" style="padding-top:48px">
  <p>쿠팡으로 이동합니다. 자동으로 넘어가지 않으면 <a href="https://link.coupang.com/a/gJIOd2FuJU">여기</a>를 누르세요.</p>
  <p class="meta" style="margin-top:12px">이 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
</main>
</body>
